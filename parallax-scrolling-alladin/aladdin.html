<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Whole New World — Six Parallax Scenes</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#121416;color:#f4f2ec;overflow-x:clip;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.intro,.footer{height:100vh;display:grid;place-items:center;text-align:center;padding:8vw}.intro h1,.footer h1{font-family:"Songti TC",Georgia,serif;font-size:clamp(38px,6vw,90px);font-weight:400;line-height:1.6;letter-spacing:.1em;margin:20px 0}.intro small,.footer small{letter-spacing:.3em;font-size:10px;color:#aaa69b}.intro a,.footer a{display:inline-block;margin-top:25px;color:#aaa69b;font-size:12px;text-decoration:none;letter-spacing:.12em}.footer{background:#f6f5f0;color:#262928}.scene-title{height:60vh;min-height:240px;background:#f6f5f0;color:#262928;display:grid;place-items:center;text-align:center;padding:8vw}.scene-title h1{margin:0;font-family:"Songti TC",Georgia,serif;font-size:clamp(30px,4.6vw,68px);font-weight:400;letter-spacing:.14em;line-height:1.6}
/* 每一個 parent 300vh，child 100vh；場景內只有圖層，沒有文字。 */
.scene-parent{height:300vh;position:relative;isolation:isolate}.scene-viewport{height:100vh;width:100%;position:sticky;top:0;overflow:hidden;background:#202329}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;filter:brightness(.9);z-index:0}.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(#0003,#0000 60%,#0003);pointer-events:none}.railing{position:absolute;bottom:-1px;left:0;width:100%;height:34vh;object-fit:fill;z-index:30;filter:brightness(1.16);pointer-events:none}.princess-layer{position:absolute;z-index:20;left:10vw;bottom:10vh;width:min(46vh,35vw);aspect-ratio:465/379;transform-origin:28% 98%;will-change:transform}.princess-layer svg{display:block;width:100%;height:100%;overflow:visible}.aladdin-layer{position:absolute;z-index:40;left:0;bottom:14vh;width:min(96vh,68vw);aspect-ratio:850/577;will-change:transform;transform:translate3d(108vw,0,0)}.aladdin-layer img{width:100%;height:100%;display:block}.moving-couple{position:absolute;width:min(68vw,84vh);height:auto;left:0;top:0;z-index:10;will-change:transform;transform-origin:center;pointer-events:none;filter:drop-shadow(0 12px 15px #0003)}.near-cloud{position:absolute;z-index:20;width:130%;height:40vh;left:-15%;bottom:-22vh;background:#c8cbd0;border-radius:50%;filter:blur(27px);opacity:.58;will-change:transform;pointer-events:none}.near-cloud.back{z-index:3;bottom:auto;top:-28vh;left:20%;opacity:.23}.scene-viewport[data-look="city"] .moving-couple{width:min(65vw,80vh)}.scene-viewport[data-look="garden"] .moving-couple{width:min(62vw,75vh)}.scene-viewport[data-look="fireworks"] .moving-couple{width:min(55vw,65vh)}.garden-front{position:absolute;z-index:20;bottom:-27vh;left:-18vw;width:145vw;height:40vh;border-radius:50%;background:#101415;opacity:.8;will-change:transform}.foreground-dune{position:absolute;z-index:20;bottom:-22vh;left:-12vw;width:130vw;height:33vh;border-radius:50%;background:#363638;will-change:transform}.scene-viewport[data-look="clouds"] .background{object-position:65% center}.scene-viewport[data-look="garden"] .background{object-position:45% center}.scene-viewport[data-look="fireworks"] .background{object-position:50% 40%}
@media(max-width:720px){.scene-title{height:60vh}.scene-title h1{font-size:31px;letter-spacing:.09em}.princess-layer{width:59vw;left:-8vw;bottom:17vh}.aladdin-layer{width:92vw;bottom:22vh}.railing{height:28vh}.moving-couple,.scene-viewport[data-look="city"] .moving-couple,.scene-viewport[data-look="garden"] .moving-couple{width:90vw}.scene-viewport[data-look="fireworks"] .moving-couple{width:76vw}.intro h1,.footer h1{font-size:38px;letter-spacing:.05em}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.near-cloud{display:none}}


/* Every later scene is one continuous arrangement of independent cutouts. */
.cutout-stage{background:#13161b}.scene-piece{position:absolute;display:block;pointer-events:none;user-select:none;will-change:transform}.piece-background{inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.piece-midground{z-index:5}.piece-hero{z-index:10;left:0;top:0;height:auto;transform-origin:center}.piece-foreground{z-index:20}.stage-city .piece-midground{width:130%;height:60vh;left:-15%;bottom:-8vh}.stage-city .piece-hero{width:min(52vw,70vh)}.stage-city .piece-foreground{left:65%;top:-12vh;width:75%;height:124vh}.stage-clouds .piece-midground{left:-20%;bottom:-17vh;width:140%;height:65vh}.stage-clouds .piece-hero{width:min(64vw,90vh)}.stage-clouds .piece-foreground{left:-25%;bottom:-26vh;width:160%;height:54vh;filter:brightness(.8)}.stage-world .piece-midground{left:-5%;bottom:0;width:120%;height:91vh}.stage-world .piece-hero{width:min(36vw,52vh)}.stage-world .piece-foreground{left:-13%;bottom:-5vh;width:min(66vw,102vh);height:auto}.stage-garden .piece-background{object-position:50% 35%;filter:brightness(.65)}.stage-garden{background:linear-gradient(#252c30,#101a20)}.stage-garden .piece-midground{left:-4%;top:-5vh;width:64%;height:98vh}.stage-garden .piece-hero{width:min(54vw,76vh)}.stage-garden .piece-foreground{left:0;top:72vh;width:min(45vw,70vh);height:auto;mix-blend-mode:screen;filter:brightness(1.5)}.stage-finale .piece-background{object-position:center top;filter:brightness(.9)}.stage-finale .piece-midground{left:-5%;bottom:0;width:110%;height:64vh}.stage-finale .piece-hero{left:50%;top:auto;bottom:-12vh;width:min(76vw,110vh);transform-origin:50% 90%}
@media(max-width:720px){.stage-city .piece-hero{width:88vw}.stage-city .piece-foreground{width:95%;left:70%}.stage-clouds .piece-hero{width:90vw}.stage-world .piece-hero{width:63vw}.stage-world .piece-foreground{width:90vw;left:-30%}.stage-garden .piece-hero{width:88vw}.stage-garden .piece-midground{width:90%;left:-22%}.stage-garden .piece-foreground{width:70vw;top:69vh}.stage-finale .piece-hero{width:120vw}.stage-finale .piece-midground{width:160%;left:-30%;height:56vh}}

.stage-clouds .piece-midground{filter:blur(2px)}.stage-clouds .piece-foreground{filter:blur(3px) brightness(.8)}

/* Brighter imagery; white edges and cast shadows follow PNG transparency. */
:root{
 --image-light:brightness(1.6) contrast(.94);
 --paper-edge-shadow:
  drop-shadow(2px 0 0 #fff)
  drop-shadow(-2px 0 0 #fff)
  drop-shadow(0 2px 0 #fff)
  drop-shadow(0 -2px 0 #fff)
  drop-shadow(0 10px 14px rgba(0,0,0,.55));
}
.scene-viewport .background,
.scene-viewport .piece-background{filter:brightness(1.5) contrast(.94)}
.scene-viewport .shade{background:linear-gradient(#0001,#0000 60%,#0001)}
.scene-viewport .railing,
.scene-viewport .princess-layer,
.scene-viewport .aladdin-layer img,
.scene-viewport .piece-midground,
.scene-viewport .piece-hero,
.scene-viewport .piece-foreground{filter:var(--image-light) var(--paper-edge-shadow)}
.stage-garden .piece-foreground{mix-blend-mode:normal}
</style></head><body><section class="intro" id="top"><div><small>A WHOLE NEW WORLD / SIX SCENES</small><h1>One step.<br>A whole new world.</h1><a href="#scene-1">Scroll to begin ↓</a></div></section><header class="scene-title"><h1>The Invitation</h1></header>

 'use strict';
 const scenes=[...document.querySelectorAll('.scene-parent')];
 const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
 let metrics=[],queued=false;
 function measure(){metrics=scenes.map(el=>({el,top:el.getBoundingClientRect().top+scrollY,travel:Math.max(1,el.offsetHeight-el.firstElementChild.offsetHeight),last:-1}));}
 // Approved Scene 01 motion: unchanged.
 function pose(index,p,w,h){
  p=clamp(p);const e=ease(p),n=w<=720;
  if(index===0){const f=clamp(p/.82),r=smooth((p-.52)/.48);return {x:w*(1.08+((n?.27:.37)-1.08)*ease(f)),y:-Math.sin(f*Math.PI)*h*.018,px:w*(n?.04:.035)*r,py:-h*.055*r,angle:2.8*r,arm:-16*r};}
  if(index===1)return {x:w*(-.58+(n?.80:.94)*e),y:h*(.54-.34*e),rotate:-7+9*e,scale:.85+.15*e,midX:-p*w*.13,midY:p*h*.025,frontX:-p*w*.16,frontY:0};
  if(index===2)return {x:w*(n?.03:.17)+Math.sin(p*Math.PI)*w*.08,y:h*(.52-.40*e),rotate:5-9*e,scale:.84+.16*e,midX:-p*w*.07,midY:p*h*.035,frontX:p*w*.18,frontY:-p*h*.07};
  if(index===3)return {x:w*(1.08-(n?.93:.72)*e),y:h*(.26-.04*Math.sin(p*Math.PI)),rotate:4-5*e,scale:.80+.20*e,midX:-p*w*.045,midY:0,frontX:-p*w*.12,frontY:0};
  if(index===4){const x=w*(-.60+(n?.87:.98)*e);return {x,y:h*(.36-.06*Math.sin(p*Math.PI)),rotate:2*Math.sin(p*Math.PI*2),scale:1,midX:-p*w*.06,midY:0,frontX:x+w*(n?.32:.13),frontY:Math.sin(p*Math.PI)*h*.012};}
  return {x:0,y:-h*.025*e,rotate:0,scale:.92+.08*e,midX:0,midY:-p*h*.035};
 }
 function render(){queued=false;const w=innerWidth,h=innerHeight;
  metrics.forEach((m,i)=>{const p=clamp((scrollY-m.top)/m.travel);if(p===m.last)return;m.last=p;const v=m.el.firstElementChild,s=pose(i,p,w,h);
   if(i===0){v.querySelector('.aladdin-layer').style.transform=`translate3d(${s.x}px,${s.y}px,0)`;v.querySelector('.princess-layer').style.transform=`translate3d(${s.px}px,${s.py}px,0) rotate(${s.angle}deg)`;document.getElementById('princessArm').setAttribute('transform',`rotate(${s.arm} 407 602)`);return;}
   const hero=v.querySelector('[data-plane="hero"]');
   hero.style.transform=i===5?`translate3d(-50%,${s.y}px,0) scale(${s.scale})`:`translate3d(${s.x}px,${s.y}px,0) rotate(${s.rotate}deg) scale(${s.scale})`;
   v.querySelector('[data-plane="midground"]').style.transform=`translate3d(${s.midX}px,${s.midY}px,0)`;
   const front=v.querySelector('[data-plane="foreground"]');if(front)front.style.transform=`translate3d(${s.frontX}px,${s.frontY}px,0)${i===1?' scaleX(-1)':''}`;
   // The background is always stationary. No scene swaps, dissolves or opacity changes.
  });
 }
 function schedule(){if(!queued){queued=true;requestAnimationFrame(render);}}
 function resize(){measure();schedule();}
 addEventListener('scroll',schedule,{passive:true});addEventListener('resize',resize,{passive:true});addEventListener('pageshow',resize);const ro=new ResizeObserver(resize);scenes.forEach(el=>ro.observe(el));measure();render();window.__layeredScenes={pose,measure,render,get metrics(){return metrics;}};
